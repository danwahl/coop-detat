  <!-- Background: matches site bg -->
  <rect width="1200" height="630" fill="#1a1a1a"/>

  <!-- ================= Game scene (Night Shift, 11x8 @ 75px) ================= -->
  <!-- Grid origin at (360, 15): grid spans 360..1185, 15..615 -->
  <g transform="translate(360 15)">
    <!-- Empty floor cells as one big rect, walls drawn on top -->
    <rect width="825" height="600" fill="#e8e0d4"/>

    <!-- Walls (perimeter + interior from level5.json) -->
    <g fill="#4a4a4a">
      <!-- Top row (row 0): y=0, full width -->
      <rect x="0" y="0" width="825" height="75"/>
      <!-- Bottom row (row 7): y=525 -->
      <rect x="0" y="525" width="825" height="75"/>
      <!-- Left col (col 0), excluding corners -->
      <rect x="0" y="75" width="75" height="450"/>
      <!-- Right col (col 10) -->
      <rect x="750" y="75" width="75" height="450"/>
      <!-- Interior walls: (5,1),(5,2),(5,5),(5,6) -->
      <rect x="375" y="75" width="75" height="75"/>
      <rect x="375" y="150" width="75" height="75"/>
      <rect x="375" y="375" width="75" height="75"/>
      <rect x="375" y="450" width="75" height="75"/>
    </g>

    <!-- Cell grid lines (only over the playable area) -->
    <g stroke="#00000018" stroke-width="1" fill="none">
      <path d="M75 75 V525 M150 75 V525 M225 75 V525 M300 75 V525 M375 75 V525 M450 75 V525 M525 75 V525 M600 75 V525 M675 75 V525 M750 75 V525"/>
      <path d="M75 75 H750 M75 150 H750 M75 225 H750 M75 300 H750 M75 375 H750 M75 450 H750 M75 525 H750"/>
    </g>

    <!-- Vision overlays (red tint) -->
    <g fill="#ff0000" fill-opacity="0.22">
      <!-- guard1 at (3,1) facing down, range 3 → (3,2),(3,3),(3,4) -->
      <rect x="225" y="150" width="75" height="75"/>
      <rect x="225" y="225" width="75" height="75"/>
      <rect x="225" y="300" width="75" height="75"/>
      <!-- guard2 at (7,2) facing down, range 3 → (7,3),(7,4),(7,5) -->
      <rect x="525" y="225" width="75" height="75"/>
      <rect x="525" y="300" width="75" height="75"/>
      <rect x="525" y="375" width="75" height="75"/>
    </g>

    <!-- Patrol paths (dashed blue, between waypoint centers) -->
    <g fill="none" stroke="#2196f3" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="6 5">
      <!-- guard1: (3,1)→(3,5): centers (262.5,112.5) to (262.5,412.5) -->
      <line x1="262.5" y1="112.5" x2="262.5" y2="412.5"/>
      <!-- guard2: (7,2)→(7,6): centers (562.5,187.5) to (562.5,487.5) -->
      <line x1="562.5" y1="187.5" x2="562.5" y2="487.5"/>
    </g>

    <!-- Cages with chickens — (2,2),(8,2),(3,6) -->
    <g transform="translate(150 150)"><use href="#cagedChicken"/></g>
    <g transform="translate(600 150)"><use href="#cagedChicken"/></g>
    <g transform="translate(225 450)"><use href="#cagedChicken"/></g>

    <!-- Ninja (player) at (1,4) -->
    <g transform="translate(86.25 311.25) scale(1.46)"><use href="#ninja"/></g>

    <!-- Guard1 at (3,1), facing down -->
    <g transform="translate(236.25 86.25) scale(1.46)"><use href="#guard"/></g>

    <!-- Guard2 at (7,2), facing down -->
    <g transform="translate(536.25 161.25) scale(1.46)"><use href="#guard"/></g>

    <!-- Door at (9,4) -->
    <g transform="translate(686.25 311.25) scale(1.46)"><use href="#door"/></g>
  </g>

  <!-- ================= Giant chicken, tilted -7° around viewBox center ================= -->
  <g transform="translate(-106 15) scale(16.67) rotate(-7 18 18)">
    <use href="#chicken"/>
  </g>
</svg>
