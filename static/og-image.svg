    <!-- One cage cell (chicken + bars), origin 0,0 size 75x75 -->
    <g id="cagedChicken">
      <rect width="75" height="75" fill="#9e9e9e"/>
      <g transform="translate(18.75 18.75) scale(1.04)"><use href="#chicken"/></g>
      <g stroke="#323232" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round">
        <line x1="18.75" y1="4" x2="18.75" y2="71"/>
        <line x1="37.5" y1="4" x2="37.5" y2="71"/>
        <line x1="56.25" y1="4" x2="56.25" y2="71"/>
